<title>Julius Sanchez</title>
<meta name="description" content="Julius Sanchez is a computer science student at the University of Washington. He built Iroshine, which turns LeetCode solutions into videos, and Pyxis, a map of 56,129 Steam games.">
<style>
:root { --bg: #0c0d0f; --text: #c5c9d1; --bright: #f5f6f8; --dim: #565a63; --quiet: #868b95; --accent: #f0a05f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); }
/* The whole page is one grid of characters. Every glyph must be the same width,
   so this uses fonts with full box-drawing and block coverage. */
#screen {
  font-family: "Cascadia Mono", "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace;
  font-variant-ligatures: none; line-height: 1.16; white-space: pre; width: max-content; margin: 0 auto; padding: 20px 12px 48px;
}
.d { color: var(--dim); } .q { color: var(--quiet); } .b { color: var(--bright); font-weight: 700; } .t { color: var(--accent); font-weight: 700; }
a { color: var(--accent); text-decoration: none; }
a:hover, a:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
.cur { color: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
noscript { display: block; max-width: 40em; margin: 2em auto; padding: 0 1em; font: 16px/1.6 monospace; white-space: normal; }
</style>

      for (var k = 0; k < 3 && ops.length; k++) { var o = ops.shift(); if (o[0]) { var t = vals[o[1]]; vals[o[1]] = vals[o[2]]; vals[o[2]] = t; } hot[o[1]] = hot[o[2]] = 1; }
      if (!ops.length) { hot = {}; clearInterval(timer); timer = null; }
      draw();
    }, 40);
  }
  screen.addEventListener('click', function (e) { if (e.target.id === 'again') { e.preventDefault(); startSort(); } });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
  render();
})();
</script>
